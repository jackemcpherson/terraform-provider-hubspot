name: Quality

on:
  pull_request:
  push:
    branches: [main]

permissions: {}

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  required:
    name: Required
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up provider toolchain
        uses: ./.github/actions/setup-provider-toolchain
        with:
          tofu-version: '1.12.3'
          terraform-version: '1.15.8'
      - name: Install pinned developer tools
        run: make tools
      - name: Run required checks
        run: make check

name: Provider maintenance

on:
  schedule:
    - cron: '41 4 * * *'
  workflow_dispatch:

permissions: {}

concurrency:
  group: provider-maintenance-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  source-property-acceptance:
    name: Scheduled property-schema source acceptance
    if: github.event_name == 'schedule'
    environment: free_properties
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: hubspot-account-free-configuration
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CAPABILITY_SHARD: free_properties
      HUBSPOT_DEMO_SCRIPT: ${{ github.workspace }}/.release-demo/scripts/demo
      HUBSPOT_PROVIDER_REPO: ${{ github.workspace }}
      HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
      HUBSPOT_ACCEPTANCE_PORTAL_ID: ${{ vars.HUBSPOT_ACCEPTANCE_PORTAL_ID }}
      HUBSPOT_ACCEPTANCE_PREFIX: tf_acc_${{ github.run_id }}_${{ github.run_attempt }}_
      HUBSPOT_PORTAL_LOCK_ID: free-configuration
    steps:
      - name: Check out provider source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Check out exact Northstar demo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jackemcpherson/terraform-hubspot-instance-demo
          ref: 6710ac7f0997edc340b27f12eda8f0ebe042d5ff
          path: .release-demo
          persist-credentials: false
      - name: Set up provider toolchain
        uses: ./.github/actions/setup-provider-toolchain
        with:
          tofu-version: '1.12.3'
          terraform-version: '1.15.8'
      - name: Run fail-closed property-schema source acceptance
        run: ./scripts/one-portal-free-lifecycle.sh
      - name: Upload sanitized property-schema acceptance result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduled-acceptance-free_properties
          path: acceptance-report/free_properties.json
          if-no-files-found: error

  source-forms-acceptance:
    name: Scheduled Forms source acceptance
    if: github.event_name == 'schedule'
    environment: form_definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    concurrency:
      group: hubspot-account-free-configuration
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      CAPABILITY_SHARD: form_definitions
      HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
      HUBSPOT_ACCEPTANCE_PORTAL_ID: ${{ vars.HUBSPOT_ACCEPTANCE_PORTAL_ID }}
      HUBSPOT_ACCEPTANCE_PREFIX: tf_acc_${{ github.run_id }}_${{ github.run_attempt }}_forms_
      HUBSPOT_PORTAL_LOCK_ID: free-configuration
    steps:
      - name: Check out provider source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up provider toolchain
        uses: ./.github/actions/setup-provider-toolchain
        with:
          tofu-version: '1.12.3'
          terraform-version: '1.15.8'
      - name: Run fail-closed Forms source acceptance
        run: ./scripts/acceptance-shard.sh
      - name: Upload sanitized Forms acceptance result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: scheduled-acceptance-form_definitions
          path: acceptance-report/form_definitions*.json
          if-no-files-found: error

  property-report:
    name: Owned property-schema configuration report
    environment: free_properties
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: hubspot-account-free-configuration
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
      HUBSPOT_ACCEPTANCE_PORTAL_ID: ${{ vars.HUBSPOT_ACCEPTANCE_PORTAL_ID }}
      HUBSPOT_PORTAL_LOCK_ID: free-configuration
    steps:
      - name: Check out provider source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up provider toolchain
        uses: ./.github/actions/setup-provider-toolchain
      - name: Report stale owned property-schema configuration
        run: ./scripts/acceptance-cleanup.sh report free_properties

  forms-report:
    name: Owned Form definition report
    environment: form_definitions
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    concurrency:
      group: hubspot-account-free-configuration
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
      HUBSPOT_ACCEPTANCE_PORTAL_ID: ${{ vars.HUBSPOT_ACCEPTANCE_PORTAL_ID }}
      HUBSPOT_PORTAL_LOCK_ID: free-configuration
    steps:
      - name: Check out provider source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up provider toolchain
        uses: ./.github/actions/setup-provider-toolchain
      - name: Report stale active and retained Archived form definitions
        run: ./scripts/acceptance-cleanup.sh report form_definitions

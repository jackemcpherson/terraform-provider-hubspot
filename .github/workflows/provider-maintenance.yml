name: Provider maintenance

on:
  schedule:
    - cron: '41 4 * * 1'
  workflow_dispatch:

permissions: {}

concurrency:
  group: hubspot-account-free-configuration
  cancel-in-progress: false

jobs:
  maintenance:
    name: Weekly provider maintenance
    environment: northstar
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      HUBSPOT_DEMO_SCRIPT: ${{ github.workspace }}/.demo-source/scripts/demo
      HUBSPOT_PROVIDER_REPO: ${{ github.workspace }}
      HUBSPOT_NORTHSTAR_MEMBERSHIP_EMAIL: ${{ vars.HUBSPOT_NORTHSTAR_MEMBERSHIP_EMAIL }}
      HUBSPOT_ACCEPTANCE_PORTAL_ID: ${{ vars.HUBSPOT_ACCEPTANCE_PORTAL_ID }}
      HUBSPOT_PORTAL_LOCK_ID: free-configuration
    steps:
      - name: Check out provider source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify maintenance source
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - name: Check out Northstar demo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: jackemcpherson/terraform-hubspot-instance-demo
          ref: 793256402c5e1e811cd374f0815a83c66f092616
          path: .demo-source
          persist-credentials: false
      - name: Set up provider toolchain
        uses: ./.github/actions/setup-provider-toolchain
        with:
          tofu-version: '1.12.3'
          terraform-version: '1.15.8'
      - name: Install maintenance tools
        run: make maintenance-tools
      - name: Run maintenance
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: make maintenance

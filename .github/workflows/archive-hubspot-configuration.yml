name: Archive HubSpot configuration

on:
  workflow_dispatch:
    inputs:
      shard:
        description: Configuration surface to clean
        required: true
        type: choice
        options:
          - free_properties
          - form_definitions
          - files_configuration
          - account_memberships
          - product_definitions
      prefix:
        description: Exact tf_acc_ prefix ending in underscore
        required: true
        type: string
      confirmation:
        description: Enter the confirmation required for the selected surface
        required: true
        type: string

permissions: {}

concurrency:
  group: hubspot-account-free-configuration
  cancel-in-progress: false

jobs:
  archive:
    name: Archive exact owned configuration prefix
    environment: ${{ inputs.shard }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      HUBSPOT_ACCEPTANCE_PORTAL_ID: ${{ vars.HUBSPOT_ACCEPTANCE_PORTAL_ID }}
      HUBSPOT_PORTAL_LOCK_ID: free-configuration
      SHARD: ${{ inputs.shard }}
      PREFIX: ${{ inputs.prefix }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Check out provider source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verify archival source
        env:
          WORKFLOW_REF: ${{ github.ref }}
        run: test "$WORKFLOW_REF" = refs/heads/main
      - name: Set up provider toolchain
        uses: ./.github/actions/setup-provider-toolchain
      - name: Archive exact owned configuration
        env:
          HUBSPOT_ACCESS_TOKEN: ${{ secrets.HUBSPOT_ACCESS_TOKEN }}
        run: ./scripts/acceptance-cleanup.sh archive "$SHARD" "$PREFIX" "$CONFIRMATION"

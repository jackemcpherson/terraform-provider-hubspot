name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: v-prefixed SemVer to release
        required: true
        type: string

permissions: {}

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish provider release
    environment: release
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      checks: read
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      REPOSITORY: ${{ github.repository }}
      VERSION: ${{ inputs.version }}
    steps:
      - name: Check out release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.26.5'
          check-latest: false
          cache: false
      - name: Verify release input and source
        env:
          COMMIT: ${{ github.sha }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          test "$WORKFLOW_REF" = refs/heads/main
          ./scripts/release-preflight.sh "$VERSION" "$COMMIT"
          git fetch --no-tags origin main:refs/remotes/origin/main
          test "$COMMIT" = "$(git rev-parse refs/remotes/origin/main)"
          required_checks=$(gh api "repos/$REPOSITORY/commits/$COMMIT/check-runs" --jq '[.check_runs[] | select(.name == "Required" and .conclusion == "success")] | length')
          test "$required_checks" -ge 1
          if gh release view "$VERSION" --repo "$REPOSITORY" >/dev/null 2>&1; then
            echo 'release already exists' >&2
            exit 1
          fi
      - name: Import release signing key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
        run: printf '%s' "$GPG_PRIVATE_KEY" | gpg --batch --import
      - name: Create signed release tag
        env:
          COMMIT: ${{ github.sha }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
        run: |
          if git rev-parse "$VERSION^{commit}" >/dev/null 2>&1; then
            test "$(git rev-parse "$VERSION^{commit}")" = "$COMMIT"
          else
            git config user.name release-bot
            git config user.email release-bot@users.noreply.github.com
            git tag -s "$VERSION" -u "$GPG_FINGERPRINT" -m "$VERSION" "$COMMIT"
            git push "https://x-access-token:$GH_TOKEN@github.com/$REPOSITORY.git" "refs/tags/$VERSION"
          fi
          git verify-tag "$VERSION"
      - name: Build assets and publish for Terraform and OpenTofu
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.17.0
          args: release --clean --release-notes docs/releases/v0.3.0.md
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GORELEASER_CURRENT_TAG: ${{ inputs.version }}
          GPG_FINGERPRINT: ${{ secrets.GPG_FINGERPRINT }}
